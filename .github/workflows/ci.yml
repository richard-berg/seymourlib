name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Tests / Lint / Typecheck
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync project (all extras)
        run: uv sync --all-extras

      # Guard against the matrix silently testing a different interpreter
      - name: Check Python version
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          actual=$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Expected Python $EXPECTED, got $actual"
            exit 1
          fi

      # ---- Lint -------------------------------------------------------------
      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      # ---- Typecheck --------------------------------------------------------
      - name: Mypy
        run: uv run mypy src

      # ---- Tests ------------------------------------------------------------
      - name: Run tests
        run: uv run pytest -q --disable-warnings

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
